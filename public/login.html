<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — Website Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/hub.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a class="brand" href="/website"><span class="brand-mark">GS</span><span>Website Builder</span></a>
      <h1>Accedi</h1>
      <p class="muted">Account locale del Website Builder. Non serve Gestione Semplificata.</p>
      <div class="alert" id="error"></div>
      <form id="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <div class="cta">
          <button class="btn btn-primary" type="submit">Accedi</button>
          <a class="btn btn-outline" href="/register">Registrati</a>
        </div>
      </form>
      <p class="muted" style="margin-top:1rem"><a href="/website">Torna all’hub</a></p>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var redirect = params.get('redirect') || '/website';
      if (redirect.charAt(0) !== '/' || redirect.charAt(1) === '/') redirect = '/website';
      document.getElementById('form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var err = document.getElementById('error');
        err.style.display = 'none';
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        var data = await res.json().catch(function () { return {}; });
        if (res.ok && data.success) {
          location.href = redirect;
          return;
        }
        err.textContent = data.error || 'Accesso fallito';
        err.style.display = 'block';
      });
    })();
  </script>
</body>
</html>
